name: Sync GitHub recommendations

on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-stars
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.STARS_READ_TOKEN || github.token }}
          ACCOUNT_TOKEN: ${{ secrets.STARS_READ_TOKEN != '' && '1' || '0' }}
        run: python3 scripts/sync.py
      - name: Publish changed recommendations
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh GitHub recommendations'
          git push
